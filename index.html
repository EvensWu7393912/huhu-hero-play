<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="screen-orientation" content="landscape">
  <meta name="robots" content="noindex,nofollow">
  <title>狐狐勇者</title>
  <link rel="stylesheet" href="./mobile.css">
  <script type="module" src="./assets/index-BYd0MaGt.js"></script>
</head>
<body>
  <main id="stage"><div id="game"></div></main>
  <button id="pause" type="button" aria-label="暂停游戏" hidden>Ⅱ</button>
  <section id="menu" aria-labelledby="menu-title" hidden>
    <div class="card">
      <div class="hero" aria-hidden="true"></div>
      <h1 id="menu-title">狐狐勇者</h1>
      <p id="instructions">向右走，读怪物头上的英文。靠近武器看中文释义，点「砍」捡起意思相符的武器，再砍向那只怪物。</p>
      <p id="controls">连点「跳」可以二段跳。「滚」躲攻击，受伤后在地面点「药」回血。</p>
      <p id="rotate" hidden>横过手机，单词和按键会更大。屏幕锁定时也可以竖屏试玩。</p>
      <button id="play" type="button" disabled>正在加载…</button>
    </div>
  </section>
  <script src="./mobile.js"></script>
</body>
</html>
